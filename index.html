<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesan untukmu!</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h2 class="question-text">Apakah kamu menyukaiku?</h2>
      <img
        class="main-image"
        src="foto/neutral_face.png"
        alt="Wajah netral atau berpikir"
        data-image="initial"
      />

      <div class="button-group">
        <button class="yes-button">Ya!</button>
        <button class="no-button">Tidak</button>
      </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
